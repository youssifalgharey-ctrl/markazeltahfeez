<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدورة الصيفية للحفظ المكثف - مركز تحفيظ القرآن الكريم بأسريجه</title>
    <meta name="description" content="الدورة الصيفية السنوية للحفظ المكثف بمركز تحفيظ القرآن الكريم بأسريجه - سيتم إضافة المحتوى قريباً.">

    <!-- تطبيق الثيم فوراً لمنع الوميض -->
    <script>
        (function () {
            var theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">

    <style>
        .empty-state-container {
            min-height: 65vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .empty-state-card {
            background: #ffffff;
            border: 1.5px solid var(--card-border);
            border-radius: 28px;
            padding: 60px 40px;
            text-align: center;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 20px 45px rgba(10, 77, 60, 0.08);
            position: relative;
            overflow: hidden;
        }
        [data-theme="dark"] .empty-state-card {
            background: #15221d;
            border-color: #24362e;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
        }

        .empty-state-icon-wrapper {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(13, 107, 83, 0.15));
            color: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            margin: 0 auto 24px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            animation: pulse-gold 2.5s infinite;
        }

        @keyframes pulse-gold {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 16px rgba(212, 175, 55, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        .empty-state-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(13, 107, 83, 0.1);
            color: var(--emerald);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        [data-theme="dark"] .empty-state-badge {
            background: rgba(52, 211, 153, 0.15);
            color: #34d399;
        }

        .empty-state-title {
            font-size: 26px;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 14px;
            line-height: 1.4;
        }
        [data-theme="dark"] .empty-state-title { color: #f1f5f9; }

        .empty-state-desc {
            font-size: 16px;
            color: var(--text-muted);
            line-height: 1.85;
            margin-bottom: 30px;
        }

        .btn-back-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--emerald);
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 14.5px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(13, 107, 83, 0.25);
        }
        .btn-back-home:hover {
            background: #0a4d3c;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(10, 77, 60, 0.35);
        }

        @media (max-width: 640px) {
            .empty-state-card { padding: 40px 20px; }
            .empty-state-title { font-size: 22px; }
            .empty-state-desc { font-size: 14.5px; }
        }
    </style>
</head>
<body>

<div id="sidebar-container"></div>

<!-- شريط التنقل العلوي -->
<nav class="navbar">
    <div class="nav-right-side">
        <button class="menu-toggle-btn" onclick="toggleSideMenu()" title="القائمة">
            <i class="fa-solid fa-bars"></i>
        </button>
        <a href="/home.html" class="logo">
            <img src="/images/brand/logo.png" alt="شعار مركز تحفيظ القرآن الكريم بأسريجه" class="logo-img" width="144" height="130" fetchpriority="high">
        </a>
    </div>

    <div class="user-nav-actions">
        <a href="/home.html" class="btn-card-details" style="padding: 8px 14px; font-size: 13px;">
            <i class="fa-solid fa-house"></i> الرئيسية
        </a>
        <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="تبديل الوضع الليلي/النهاري">
            <i class="fa-solid fa-moon theme-icon" id="themeIcon"></i>
        </button>
        <a href="/account.html" class="user-badge" id="navUserInfo" title="عرض الملف الشخصي">
            <i class="fa-solid fa-circle-user"></i>
            <span id="userName">مستخدم</span>
        </a>
    </div>
</nav>

<div class="section-container" style="max-width: 1280px; padding: 25px 20px 60px;">

    <div class="empty-state-container">
        <div class="empty-state-card">
            <div class="empty-state-icon-wrapper">
                <i class="fa-solid fa-sun"></i>
            </div>
            
            <div class="empty-state-badge">
                <i class="fa-solid fa-clock"></i> مسار قيد الإعداد
            </div>

            <h1 class="empty-state-title">الدورة الصيفية للحفظ المكثف</h1>
            
            <p class="empty-state-desc">
                سيتم إضافة المحتوى قريباً بإذن الله تعالى.
            </p>

            <a href="/home.html" class="btn-back-home">
                <i class="fa-solid fa-arrow-right"></i> العودة للصفحة الرئيسية
            </a>
        </div>
    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof loadSidebar === 'function') loadSidebar();
    });
</script>

<script src="/js/app.js"></script>
</body>
</html>
