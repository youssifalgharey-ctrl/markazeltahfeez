<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتيجتي - مركز تحفيظ القرآن الكريم بأسريجه</title>

    <!-- تطبيق الثيم فوراً قبل أي رسم للصفحة، لمنع وميض التحول من الفاتح للغامق -->
    <script>
        (function () {
            var theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- إعادة استخدام نفس ملف الأنماط الرئيسي للموقع بدل تكرار المتغيرات والخطوط -->
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        /* أنماط خاصة بصفحة "نتيجتي" فقط */

        /* --- بطاقة البحث عن الكود --- */
        .lookup-card {
            background: #ffffff;
            border: 1.5px solid var(--card-border);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 8px 30px rgba(10, 77, 60, 0.06);
            max-width: 560px;
            margin: 0 auto 30px auto;
            text-align: center;
        }

        .lookup-icon {
            width: 62px;
            height: 62px;
            border-radius: 16px;
            background: var(--light-emerald);
            color: var(--emerald);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 16px auto;
        }

        .lookup-card h4 {
            font-size: 17px;
            font-weight: 800;
            color: #1a202c;
            margin-bottom: 6px;
        }

        .lookup-card p {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 22px;
        }

        .form-group {
            text-align: right;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 12px;
            border: 1.5px solid var(--card-border);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            font-family: inherit;
            color: var(--text-main);
            background: #fafcfb;
            text-align: center;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--emerald);
        }

        .form-group input.input-error {
            border-color: #e74c3c !important;
        }

        .form-group .error-hint {
            display: none;
            color: #e74c3c;
            font-size: 12px;
            font-weight: 700;
            margin-top: 8px;
        }

        .btn-check {
            width: 100%;
            background: var(--primary-green);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-check:hover {
            background: var(--emerald);
        }

        .btn-check:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .btn-check .fa-spinner {
            display: none;
        }

        .btn-check.loading .fa-spinner {
            display: inline-block;
        }

        .btn-check.loading .fa-magnifying-glass {
            display: none;
        }

        /* --- حالة الخطأ / عدم وجود نتيجة --- */
        .lookup-message {
            display: none;
            max-width: 560px;
            margin: 0 auto 30px auto;
            border-radius: 14px;
            padding: 18px 22px;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.8;
        }

        .lookup-message.show {
            display: block;
        }

        .lookup-message.error {
            background: rgba(231, 76, 60, 0.08);
            color: #c0392b;
            border: 1.5px solid rgba(231, 76, 60, 0.25);
        }

        .lookup-message.info {
            background: var(--light-emerald);
            color: var(--primary-green);
            border: 1.5px solid rgba(13, 107, 83, 0.2);
        }

        /* --- بطاقات النتائج --- */
        #resultsWrapper {
            display: none;
            max-width: 720px;
            margin: 0 auto 40px auto;
        }

        .student-name-banner {
            text-align: center;
            font-size: 16px;
            font-weight: 800;
            color: #1a202c;
            margin-bottom: 22px;
        }

        .student-name-banner span {
            color: var(--emerald);
        }

        .result-card {
            background: #ffffff;
            border: 1.5px solid var(--card-border);
            border-radius: 18px;
            padding: 22px 24px;
            margin-bottom: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
        }

        .result-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .result-exam-name {
            font-size: 16px;
            font-weight: 800;
            color: #1a202c;
        }

        .result-exam-date {
            font-size: 12.5px;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 4px;
        }

        .result-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .result-status-badge.pass {
            background: rgba(13, 107, 83, 0.1);
            color: var(--emerald);
        }

        .result-status-badge.fail {
            background: rgba(231, 76, 60, 0.1);
            color: #c0392b;
        }

        .result-score-row {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 14px;
        }

        .result-score-number {
            font-size: 30px;
            font-weight: 800;
            color: var(--emerald);
            line-height: 1;
            white-space: nowrap;
        }

        .result-score-number small {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .result-progress-track {
            flex: 1;
            height: 12px;
            border-radius: 8px;
            background: var(--light-emerald);
            overflow: hidden;
        }

        .result-progress-fill {
            height: 100%;
            border-radius: 8px;
            background: var(--emerald);
            transition: width 0.6s ease;
        }

        .result-status-badge.fail ~ .result-score-row .result-progress-fill,
        .result-card.is-fail .result-progress-fill {
            background: #e74c3c;
        }

        .result-card.is-fail .result-score-number {
            color: #c0392b;
        }

        .result-percentage {
            font-size: 13px;
            font-weight: 800;
            color: var(--text-muted);
            min-width: 44px;
            text-align: left;
        }

        .result-notes {
            font-size: 13.5px;
            color: var(--text-main);
            background: #fafcfb;
            border: 1.5px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 14px;
            line-height: 1.7;
        }

        .result-notes i {
            color: var(--emerald);
            margin-left: 6px;
        }

        .search-again-row {
            text-align: center;
            margin-top: 10px;
        }

        .btn-search-again {
            background: transparent;
            border: 1.5px solid var(--emerald);
            color: var(--emerald);
            padding: 10px 22px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-search-again:hover {
            background: var(--emerald);
            color: #fff;
        }

        @media (max-width: 600px) {
            .lookup-card {
                padding: 24px 18px;
            }
            .result-score-row {
                flex-wrap: wrap;
            }
            .result-progress-track {
                order: 3;
                width: 100%;
            }
        }

        /* --- الوضع الليلي --- */
        [data-theme="dark"] .lookup-card,
        [data-theme="dark"] .result-card {
            background: #16241f;
            border-color: #23352c;
        }

        [data-theme="dark"] .lookup-card h4,
        [data-theme="dark"] .student-name-banner,
        [data-theme="dark"] .result-exam-name {
            color: #e2e8f0;
        }

        [data-theme="dark"] .form-group input {
            background: #0f1a16;
            border-color: #23352c;
            color: #e2e8f0;
        }

        [data-theme="dark"] .result-notes {
            background: #0f1a16;
            border-color: #23352c;
            color: #e2e8f0;
        }

        [data-theme="dark"] .lookup-message.info {
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border-color: rgba(52, 211, 153, 0.3);
        }

        [data-theme="dark"] .lookup-message.error {
            background: rgba(231, 76, 60, 0.1);
            color: #ff8a75;
            border-color: rgba(231, 76, 60, 0.3);
        }
    </style>
</head>
<body>

<!-- مكان إدراج القائمة الجانبية المرفوعة من sidebar.html -->
<div id="sidebar-container"></div>

<!-- شريط التنقل العلوي -->
<nav class="navbar">
    <div class="nav-right-side">
        <button class="menu-toggle-btn" onclick="toggleSideMenu()" title="القائمة">
            <i class="fa-solid fa-bars"></i>
        </button>

        <a href="/home.html" class="logo">
            <img src="/images/brand/logo.png" alt="شعار مركز تحفيظ القرآن الكريم بأسريجه" class="logo-img" width="144" height="130" fetchpriority="high">
        </a>
    </div>

    <div class="user-nav-actions">
        <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="تبديل الوضع الليلي/النهاري">
            <i class="fa-solid fa-moon theme-icon" id="themeIcon"></i>
        </button>
        <a href="/account.html" class="user-badge" id="navUserInfo" title="عرض الملف الشخصي">
            <i class="fa-solid fa-circle-user"></i>
            <span id="userName">مستخدم</span> (كود: <span id="userCode">----</span>)
        </a>
    </div>
</nav>

<!-- مقدمة الصفحة -->
<section class="section-container" id="result">
    <div class="section-header">
        <h3 class="section-title"><i class="fa-solid fa-clipboard-check"></i> نتيجتي</h3>
    </div>
    <p style="color: var(--text-muted); font-size: 15px; line-height: 1.8; margin-bottom: 10px; text-align: center; max-width: 700px; margin-inline: auto;">
        اكتب كود الامتحان الخاص بك في الخانة تحت، وهيظهرلك درجتك وتفاصيل نتيجتك فوراً.
    </p>
</section>

<!-- بطاقة البحث بالكود -->
<div id="lookupCardWrapper">
    <div class="lookup-card">
        <div class="lookup-icon"><i class="fa-solid fa-magnifying-glass-chart"></i></div>
        <h4>الاستعلام عن النتيجة</h4>
        <p>أدخل كود النتيجة اللي اداهولك الشيخ بعد الامتحان لعرض درجتك.</p>

        <div class="form-group">
            <label for="resultCodeInput">كود النتيجة</label>
            <input type="text" id="resultCodeInput" placeholder="مثال: EX-1234" autocomplete="off" onkeydown="if(event.key==='Enter'){checkResult();}">
            <span class="error-hint" id="codeErrorHint">لازم تكتب الكود الأول</span>
        </div>

        <button class="btn-check" id="checkResultBtn" onclick="checkResult()">
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-solid fa-spinner fa-spin"></i>
            إظهار النتيجة
        </button>
    </div>
</div>

<!-- رسالة خطأ / تنبيه -->
<div class="lookup-message" id="lookupMessage"></div>

<!-- عرض النتائج -->
<div id="resultsWrapper">
    <div class="student-name-banner">نتيجة الطالب: <span id="resultStudentName">-</span></div>
    <div id="resultsList"></div>
    <div class="search-again-row">
        <button class="btn-search-again" onclick="resetLookup()">
            <i class="fa-solid fa-rotate-right"></i> استعلام عن كود تاني
        </button>
    </div>
</div>

<script src="/js/app.js"></script>
<script>
    /*
     * ==================================================================
     * ملاحظة مهمة لربط الصفحة بقاعدة البيانات لاحقاً (Backend Contract)
     * ==================================================================
     * الصفحة دي جاهزة بالكامل من ناحية الشكل والتفاعل، وبتستنى بس
     * إندبوينت في الباك اند بالشكل ده:
     *
     *   GET /api/results/{code}
     *
     * ولازم يرجع Response بصيغة JSON زي المثال ده بالظبط (studentName
     * وmapper اسمه results عبارة عن Array عشان لو الكود مرتبط بأكتر
     * من امتحان يتعرضوا كلهم):
     *
     * {
     *   "studentName": "يوسف كمال",
     *   "results": [
     *     {
     *       "examName": "امتحان تجويد - الوحدة الثالثة",
     *       "examDate": "2026-08-20",
     *       "score": 27,
     *       "maxScore": 30,
     *       "passed": true,
     *       "notes": "أداء ممتاز في أحكام النون الساكنة"
     *     }
     *   ]
     * }
     *
     * - لو الكود مش موجود خالص: يرجع status 404.
     * - لو حصل خطأ في السيرفر: يرجع status 500.
     * - في الحالتين، الصفحة بتتعامل مع الخطأ وبتعرض رسالة مناسبة
     *   للطالب من غير ما تكسر الصفحة.
     *
     * الإندبوينت بقى جاهز فعلاً في الباك اند (ExamResultController)،
     * فالوضع التجريبي (DEMO_MODE) بقى false والصفحة بتكلم السيرفر
     * الحقيقي دلوقتي. لو حبيت ترجع للمعاينة الشكلية بدون سيرفر،
     * رجّعها true تاني وهتشتغل بالبيانات التجريبية تحت.
     */
    const DEMO_MODE = false;
    const DEMO_RESULTS = {
        'EX-2451': {
            studentName: 'يوسف كمال',
            results: [
                {
                    examName: 'امتحان تجويد - الوحدة الثالثة',
                    examDate: '2026-08-20',
                    score: 27,
                    maxScore: 30,
                    passed: true,
                    notes: 'أداء ممتاز في أحكام النون الساكنة والتنوين، مطلوب مراجعة بسيطة لأحكام المدود.'
                },
                {
                    examName: 'اختبار حفظ جزء عم',
                    examDate: '2026-08-05',
                    score: 16,
                    maxScore: 20,
                    passed: true,
                    notes: 'حفظ جيد، يُنصح بمزيد من المراجعة لضبط التشكيل.'
                }
            ]
        }
    };

    function showMessage(text, type) {
        const el = document.getElementById('lookupMessage');
        el.textContent = text;
        el.className = 'lookup-message show ' + type;
    }

    function hideMessage() {
        const el = document.getElementById('lookupMessage');
        el.className = 'lookup-message';
    }

    function setLoading(isLoading) {
        const btn = document.getElementById('checkResultBtn');
        btn.disabled = isLoading;
        btn.classList.toggle('loading', isLoading);
    }

    function renderResults(data) {
        document.getElementById('resultStudentName').textContent = data.studentName || '-';

        const list = document.getElementById('resultsList');
        list.innerHTML = '';

        (data.results || []).forEach(function (r) {
            const percentage = r.maxScore ? Math.round((r.score / r.maxScore) * 100) : 0;
            const passed = (typeof r.passed === 'boolean') ? r.passed : (percentage >= 50);

            const card = document.createElement('div');
            card.className = 'result-card' + (passed ? '' : ' is-fail');

            const dateText = r.examDate ? formatArabicDate(r.examDate) : '';

            card.innerHTML =
                '<div class="result-card-top">' +
                    '<div>' +
                        '<div class="result-exam-name"></div>' +
                        (dateText ? '<div class="result-exam-date"></div>' : '') +
                    '</div>' +
                    '<span class="result-status-badge ' + (passed ? 'pass' : 'fail') + '">' +
                        '<i class="fa-solid ' + (passed ? 'fa-circle-check' : 'fa-circle-xmark') + '"></i> ' +
                        (passed ? 'ناجح' : 'يحتاج مراجعة') +
                    '</span>' +
                '</div>' +
                '<div class="result-score-row">' +
                    '<div class="result-score-number">' + r.score + ' <small>/ ' + r.maxScore + '</small></div>' +
                    '<div class="result-progress-track"><div class="result-progress-fill" style="width:' + percentage + '%;"></div></div>' +
                    '<div class="result-percentage">' + percentage + '%</div>' +
                '</div>' +
                (r.notes ? '<div class="result-notes"><i class="fa-solid fa-comment-dots"></i></div>' : '');

            card.querySelector('.result-exam-name').textContent = r.examName || 'نتيجة امتحان';
            if (dateText) card.querySelector('.result-exam-date').textContent = dateText;
            if (r.notes) card.querySelector('.result-notes').append(document.createTextNode(r.notes));

            list.appendChild(card);
        });

        document.getElementById('lookupCardWrapper').style.display = 'none';
        document.getElementById('resultsWrapper').style.display = 'block';
        hideMessage();
    }

    function formatArabicDate(isoDate) {
        const parts = isoDate.split('-').map(Number);
        if (parts.length !== 3) return isoDate;
        return parts[2] + '/' + parts[1] + '/' + parts[0];
    }

    async function checkResult() {
        const input = document.getElementById('resultCodeInput');
        const errorHint = document.getElementById('codeErrorHint');
        const code = input.value.trim();

        if (!code) {
            input.classList.add('input-error');
            errorHint.style.display = 'block';
            input.focus();
            return;
        }
        input.classList.remove('input-error');
        errorHint.style.display = 'none';
        hideMessage();
        setLoading(true);

        try {
            if (DEMO_MODE) {
                // محاكاة زمن استجابة السيرفر في الوضع التجريبي
                await new Promise(function (resolve) { setTimeout(resolve, 500); });
                const demo = DEMO_RESULTS[code.toUpperCase()];
                if (!demo) {
                    showMessage('مفيش نتيجة بالكود ده. جرّب كود "EX-2451" للتجربة، أو تأكد من الكود مع الشيخ.', 'error');
                    return;
                }
                renderResults(demo);
                return;
            }

            const response = await fetch('/api/results/' + encodeURIComponent(code));

            if (response.status === 404) {
                showMessage('مفيش نتيجة مسجلة بهذا الكود. اتأكد من كتابة الكود صح أو راجع الشيخ.', 'error');
                return;
            }
            if (!response.ok) {
                showMessage('حصل خطأ أثناء جلب النتيجة، حاول مرة أخرى بعد شوية.', 'error');
                return;
            }

            const data = await response.json();
            renderResults(data);
        } catch (err) {
            showMessage('تعذر الاتصال بالسيرفر، تأكد من اتصالك بالإنترنت وحاول مرة أخرى.', 'error');
        } finally {
            setLoading(false);
        }
    }

    function resetLookup() {
        document.getElementById('resultCodeInput').value = '';
        document.getElementById('resultsWrapper').style.display = 'none';
        document.getElementById('lookupCardWrapper').style.display = 'block';
        hideMessage();
        document.getElementById('resultCodeInput').focus();
    }
</script>
</body>
</html>
