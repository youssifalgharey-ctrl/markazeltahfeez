# --- Server ---
server.port=8080

# --- H2 in-memory database (no installation needed) ---
spring.datasource.url=jdbc:h2:mem:authdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- H2 web console (visit http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JWT ---
# IMPORTANT: change this secret before deploying anywhere real.
# It must be at least 32 characters long (HMAC-SHA256 requirement).
jwt.secret=ChangeThisToALongRandomSecretKeyBeforeDeployingAnywhereReal123
jwt.expiration-ms=86400000
